name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: TEST
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Front_1  # <--- CRITICAL: Tells GitHub code is in subfolder
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # Run Cypress
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./Front_1 # <--- Cypress needs this too
          start: npx serve -l 3000
          wait-on: 'http://localhost:3000'
          browser: chrome
          spec: cypress/e2e/user_flows.cy.js

  # JOB 2: DEPLOY
  cd:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
