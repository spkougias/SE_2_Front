name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Continuous Integration (Test)
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # Uses the official Cypress action to run your user flows
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          start: npx serve -l 3000
          wait-on: 'http://localhost:3000'
          browser: chrome
          spec: cypress/e2e/user_flows.cy.js

  # JOB 2: Continuous Deployment (Deploy)
  cd:
    runs-on: ubuntu-latest
    needs: ci # Only run if tests pass
    if: github.ref == 'refs/heads/main' # Only deploy from main branch
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
